name: Swift macOS template

on:
  workflow_dispatch:
  push:
    paths:
      - 'blueprints/switftmac/**'
      - 'violations/switftmac/**'
      - 'tests/**'
      - 'project-setup/**'
      - 'justfile'
      - '.github/workflows/switftmac.yml'
  pull_request:
    paths:
      - 'blueprints/switftmac/**'
      - 'violations/switftmac/**'
      - 'tests/**'
      - 'project-setup/**'
      - 'justfile'
      - '.github/workflows/switftmac.yml'

permissions:
  contents: read

jobs:
  resolve-dependencies:
    name: Capture Swift 6.4 dependency resolution
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: extractions/setup-just@v3
      - run: python -m pip install copier==9.17.2
      # Temporary maintenance job: produce the lock under the required compiler.
      # The independent template job below still enforces committed resolutions.
      - name: Resolve the explicitly pinned application dependencies
        run: |
          set -euo pipefail
          copier copy --trust --defaults --skip-tasks \
            --data project_name=lock-capture \
            --data bundle_identifier=com.example.lockcapture \
            blueprints/switftmac "$RUNNER_TEMP/lock-capture"
          cd "$RUNNER_TEMP/lock-capture"
          bash scripts/check-host.sh
          bash scripts/install-tools.sh
          source scripts/environment.sh
          xcodegen generate --spec project.yml
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - uses: actions/upload-artifact@v4
        with:
          name: switftmac-swift64-resolution
          if-no-files-found: error
          path: ${{ runner.temp }}/lock-capture/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  template:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      PROJECT_DIR: ${{ github.workspace }}/.ci-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: extractions/setup-just@v3
      - name: Install generator
        run: python -m pip install copier==9.17.2
      - name: Verify exact Apple toolchain
        run: bash blueprints/switftmac/template/scripts/check-host.sh
      - name: Repository integration contracts
        run: |
          set -euo pipefail
          python tests/test_switftmac.py
          python tests/test_template_info.py
          python tests/test_template_prerequisites.py
      - name: Install a fresh generated application
        run: |
          set -euo pipefail
          copier copy --trust --defaults --skip-tasks \
            --data project_name=switftmac-ci \
            --data bundle_identifier=com.example.switftmacci \
            blueprints/switftmac "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          git init -q
          just init
      - name: Verify snapshot references
        working-directory: ${{ env.PROJECT_DIR }}
        run: just test-snapshots
      - name: Full generated application CI
        working-directory: ${{ env.PROJECT_DIR }}
        run: just ci
      - name: Repository baseline and violation target
        run: just test-switftmac
      - name: Preserve reports and snapshot differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switftmac-evidence
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/build/results/
            ${{ env.PROJECT_DIR }}/build/logs/
            ${{ env.PROJECT_DIR }}/build/reports/
            ${{ env.PROJECT_DIR }}/Tests/AppTests/__Snapshots__/
