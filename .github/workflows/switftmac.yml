name: Swift macOS template

on:
  workflow_dispatch:
  push:
    paths:
      - 'blueprints/switftmac/**'
      - 'violations/switftmac/**'
      - 'tests/**'
      - 'project-setup/**'
      - 'justfile'
      - '.github/workflows/switftmac.yml'
  pull_request:
    paths:
      - 'blueprints/switftmac/**'
      - 'violations/switftmac/**'
      - 'tests/**'
      - 'project-setup/**'
      - 'justfile'
      - '.github/workflows/switftmac.yml'

permissions:
  contents: read

jobs:
  template:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      PROJECT_DIR: ${{ github.workspace }}/.ci-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: extractions/setup-just@v3
      - name: Install generator
        run: python -m pip install copier==9.17.2
      - name: Verify exact Apple toolchain
        run: bash blueprints/switftmac/template/scripts/check-host.sh
      - name: Repository integration contracts
        run: |
          set -euo pipefail
          python tests/test_switftmac.py
          python tests/test_template_info.py
          python tests/test_template_prerequisites.py
      - name: Install a fresh generated application
        run: |
          set -euo pipefail
          copier copy --trust --defaults --skip-tasks \
            --data project_name=switftmac-ci \
            --data bundle_identifier=com.example.switftmacci \
            blueprints/switftmac "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          git init -q
          just init
      - name: Verify snapshot references
        working-directory: ${{ env.PROJECT_DIR }}
        run: just test-snapshots
      - name: Full generated application CI
        working-directory: ${{ env.PROJECT_DIR }}
        run: just ci
      - name: Repository baseline and violation target
        run: just test-switftmac
      - name: Capture independent snapshot evidence after failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: just test-snapshots
      - name: Diagnose native launch metric variants
        if: failure()
        run: |
          set -euo pipefail
          cp tests/fixtures/switftmac/LaunchMetricDiagnostics.swift \
            "$PROJECT_DIR/UITests/PerformanceTests/AppLaunchPerformanceTests.swift"
          cd "$PROJECT_DIR"
          bash scripts/xcode.sh test -only-testing:PerformanceTests \
            -enableCodeCoverage NO -enableAddressSanitizer NO -enableThreadSanitizer NO \
            -resultBundlePath build/results/launch-diagnostics.xcresult
          xcrun xcresulttool get test-results metrics --schema-version 0.1.0 \
            --path build/results/launch-diagnostics.xcresult --compact \
            >build/reports/launch-diagnostics.json
      - name: Preserve reports and snapshot differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switftmac-evidence
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/build/results/
            ${{ env.PROJECT_DIR }}/build/logs/
            ${{ env.PROJECT_DIR }}/build/reports/
            ${{ env.PROJECT_DIR }}/Tests/AppTests/__Snapshots__/
