# Clojure CLI Base Template Configuration
_min_copier_version: "9.0.0"

_subdirectory: template
_templates_suffix: ".template"
_answers_file: .copier-answers.yml

_exclude:
  - ".clj-kondo/.cache"
  - ".cpcache"
  - "target"
  - ".git"
  - "CLAUDE.md"

_skip_if_exists:
  - "src/"
  - "test/"
  - "data/input/"
  - "data/output/"
  - "scripts/"

_message_before_copy: |
  Creating a Clojure CLI project with strict, executable guardrails.

_message_after_copy: |
  Project {{project_name}} created successfully!

  Next steps:
    cd {{project_name}}
    just init
    just run

_tasks:
  - "ln -s AGENTS.md CLAUDE.md"
  - "git init -q"
  - "mkdir -p .git/hooks && printf '%s\n' '#!/usr/bin/env sh' 'set -e' 'just ci-quiet' > .git/hooks/pre-commit"
  - "chmod +x .git/hooks/pre-commit"

project_name:
  type: str
  help: Project name (e.g., my-cli-tool)?
  validator: >-
    {% if not (project_name | regex_search('^[a-zA-Z0-9]([a-zA-Z0-9_.-]*[a-zA-Z0-9])?$')) %}
    Invalid project name. Use letters, digits, -, _, . only.
    {% endif %}

group_id:
  type: str
  help: Maven group ID / Clojure namespace prefix (e.g., com.example)?
  default: "com.example"
  validator: >-
    {% if not (group_id | regex_search('^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)*$')) %}
    Invalid group ID. Must be a lowercase Clojure namespace prefix.
    {% endif %}

package_name:
  type: str
  help: Clojure namespace prefix (e.g., com.example.myapp)?
  default: "{{group_id}}.{{project_name | replace('-', '') | replace('.', '') | replace('_', '') | lower}}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*$')) %}
    Invalid namespace. Use lowercase namespace segments.
    {% endif %}

package_path:
  type: str
  when: false
  default: "{{package_name | replace('-', '_') | replace('.', '/')}}"

namespace_name:
  type: str
  when: false
  default: "{{package_name}}"

namespace_path:
  type: str
  when: false
  default: "{{namespace_name | replace('-', '_') | replace('.', '/')}}"

project_slug:
  type: str
  when: false
  default: "{{project_name | replace('_', '-') | replace('.', '-') | lower}}"

project_description:
  type: str
  help: Short description?
  default: "A Clojure CLI application"

jvm_target:
  type: str
  help: JVM toolchain version?
  default: "21"
  choices:
    - "21"

author_name:
  type: str
  help: Author name?
  default: ""

author_email:
  type: str
  help: Author email?
  default: ""

coverage_threshold:
  type: int
  help: Code coverage threshold (%)?
  default: 80
  validator: >-
    {% if coverage_threshold < 0 or coverage_threshold > 100 %}
    Must be 0-100
    {% endif %}
