rules:
  - id: cpp.no-empty-catch
    languages: [cpp]
    message: >
      Empty catch blocks silently swallow errors. Either handle the exception,
      log it, or rethrow. Never ignore exceptions.
    severity: ERROR
    pattern: |
      try { ... } catch (...) {
      }
    paths:
      include:
        - src/
        - include/
      exclude:
        - tests/

  - id: cpp.no-catch-all-without-rethrow
    languages: [cpp]
    message: >
      catch(...) without rethrow hides all exceptions. Either catch specific exception
      types or rethrow after logging. Use std::expected for recoverable errors.
    severity: WARNING
    # The pattern-regex intersection is required because semgrep's `(...)`
    # ellipsis also matches typed catch clauses; this rule is only about the
    # literal catch-all `catch (...)`.
    patterns:
      - pattern: |
          try { ... } catch (...) {
            ...
          }
      - pattern-not: |
          try { ... } catch (...) {
            ...
            throw;
            ...
          }
      - pattern-regex: 'catch\s*\(\s*\.\.\.\s*\)'
    paths:
      include:
        - src/
        - include/
      exclude:
        - tests/
