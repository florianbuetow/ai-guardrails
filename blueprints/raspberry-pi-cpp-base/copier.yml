# Raspberry Pi C++ Base Template Configuration
_min_copier_version: "9.0.0"

_subdirectory: template
_templates_suffix: ".template"
_answers_file: .copier-answers.yml

_exclude:
  - "build"
  - ".git"

_skip_if_exists:
  - "src/"
  - "include/"
  - "tests/"
  - "scripts/"

_message_before_copy: |
  Creating a 64-bit Raspberry Pi C++ project with strict validation guardrails.

_message_after_copy: |
  Project {{project_name}} created successfully!

  Next steps:
    cd {{project_name}}
    just container-init  # macOS or container workflow
    just container-run
    just help
  On native ARM64 Linux with tools installed, use just init and just run.

_tasks:
  - "git init -q"
  - "mkdir -p .git/hooks && printf '%s\n' '#!/usr/bin/env sh' 'set -e' 'exec bash scripts/pre-commit.sh' > .git/hooks/pre-commit"

project_name:
  type: str
  help: Project name (e.g., pi-hello)?
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Invalid project name. Use lowercase letters, digits, and hyphens, starting with a letter.
    {% endif %}

project_description:
  type: str
  help: Short description?
  default: "A 64-bit Raspberry Pi C++ application"

author_name:
  type: str
  help: Author name?
  default: ""

author_email:
  type: str
  help: Author email?
  default: ""

coverage_threshold:
  type: int
  help: Code coverage threshold (%)?
  default: 80
  validator: >-
    {% if coverage_threshold < 0 or coverage_threshold > 100 %}
    Must be 0-100
    {% endif %}
