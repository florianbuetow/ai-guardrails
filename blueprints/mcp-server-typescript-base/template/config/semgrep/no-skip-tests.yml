rules:
  - id: typescript.no-skipped-tests
    languages: [generic]
    message: Do not skip tests. Fix the test or the implementation.
    severity: ERROR
    pattern-regex: '\b(it|test|describe)\.skip\s*[\(.]|\b(xit|xdescribe|xtest)\s*\('
    paths:
      include:
        - "*.ts"

  - id: typescript.no-only-tests
    languages: [generic]
    message: Do not commit focused tests that silently shrink the suite.
    severity: ERROR
    pattern-regex: '\b(it|test|describe)\.only\s*[\(.]'
    paths:
      include:
        - "*.ts"
