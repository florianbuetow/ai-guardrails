# TypeScript MCP Server Base Template Configuration
_min_copier_version: "9.0.0"

_subdirectory: template
_templates_suffix: ".template"
_answers_file: .copier-answers.yml

_exclude:
  - "node_modules"
  - "dist"
  - ".git"
  - "CLAUDE.md"

_skip_if_exists:
  - "src/"
  - "test/"
  - "data/input/"
  - "data/output/"
  - "scripts/"

_message_before_copy: |
  Creating a TypeScript MCP server with the stable MCP SDK v2 and strict guardrails.
  The generated server uses stdio and keeps protocol adapters separate from services.

_message_after_copy: |
  Project {{project_name}} created successfully!

  Next steps:
    cd {{project_name}}
    just init
    just test
    just inspect

_tasks:
  - "ln -sf AGENTS.md CLAUDE.md"
  - "git init -q"
  - "mkdir -p .git/hooks && printf '%s\n' '#!/usr/bin/env sh' 'set -e' 'just ci-quiet' > .git/hooks/pre-commit"

project_name:
  type: str
  help: Project name (npm package name, e.g. inventory-mcp)?
  validator: >-
    {% if not (project_name | regex_search('^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$')) %}
    Invalid project name. Use lowercase letters, digits, -, _, . only.
    {% endif %}

project_description:
  type: str
  help: Short description?
  default: "A TypeScript MCP server"

node_version:
  type: str
  help: Minimum Node.js version (the supported baseline)?
  default: "22.19.0"
  choices:
    - "22.19.0"

author_name:
  type: str
  help: Author name?
  default: ""

author_email:
  type: str
  help: Author email?
  default: ""

coverage_threshold:
  type: int
  help: Code coverage threshold (%)?
  default: 80
  validator: >-
    {% if coverage_threshold < 0 or coverage_threshold > 100 %}
    Must be 0-100
    {% endif %}
