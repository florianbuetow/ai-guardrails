# TypeScript React Base Template Configuration
# Minimum Copier version required
_min_copier_version: "9.0.0"

# Template settings
_subdirectory: template
_templates_suffix: ".template"
_answers_file: .copier-answers.yml

# Exclude patterns (extend defaults)
_exclude:
  - "node_modules"
  - "dist"
  - ".git"
  - "CLAUDE.md"  # Exclude symlink, create it via task instead

# Skip if exists (never overwrite these on update)
_skip_if_exists:
  - "src/"
  - "e2e/"
  - "data/input/"
  - "data/output/"
  - "scripts/"

# Messages
_message_before_copy: |
  Creating React + Vite + TypeScript project with full validation infrastructure.
  This will run `npm create vite` and `npm install` — network access is required.

_message_after_copy: |
  Project {{project_name}} created successfully!

  Next steps:
    cd {{project_name}}
    just init    # Install dependencies and the Playwright browser
    just run     # Start the Vite dev server

# Post-generation tasks
# ln -sf so `copier update` (which re-runs tasks) does not fail on the existing link
_tasks:
  - "ln -sf AGENTS.md CLAUDE.md"
  - "bash scripts/bootstrap-vite.sh"

# Questions
project_name:
  type: str
  help: Project name (npm package name, e.g. my-react-app)?
  validator: >-
    {% if not (project_name | regex_search('^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$')) %}
    Invalid project name. Use a valid npm package name: lowercase letters, digits, -, _, . only.
    {% endif %}

project_description:
  type: str
  help: Short description?
  default: "A React + Vite + TypeScript application"

node_version:
  type: str
  help: Minimum Node.js major version?
  default: "24"
  choices:
    - "22"
    - "24"

author_name:
  type: str
  help: Author name?
  default: ""

author_email:
  type: str
  help: Author email?
  default: ""

coverage_threshold:
  type: int
  help: Code coverage threshold (%)?
  default: 80
  validator: >-
    {% if coverage_threshold < 0 or coverage_threshold > 100 %}
    Must be 0-100
    {% endif %}
